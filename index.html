<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoryScene Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c1b;color:#edf4f1;font:15px system-ui}header{padding:12px 18px;background:#18332d;display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0 18px 0 0}button,.upload{background:#28684f;color:white;border:1px solid #43836a;padding:9px 12px;border-radius:8px;cursor:pointer}button:hover{background:#348365}input,textarea{background:#223b35;border:1px solid #4c6e63;border-radius:7px;color:white;padding:8px;width:100%}input[type=file]{display:none}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;padding:12px}.canvas-wrap{overflow:auto;background:#263631;padding:12px;border-radius:12px;min-height:65vh;display:flex;align-items:flex-start;justify-content:center}.scene{position:relative;width:min(100%,900px);aspect-ratio:1491/1055;background:#d1ddcf;overflow:hidden;touch-action:none;user-select:none}.scene>img.bg{width:100%;height:100%;object-fit:fill;position:absolute;inset:0;pointer-events:none}.actor{position:absolute;transform-origin:center center;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center}.actor.selected{outline:2px dashed #ffcc66}.actor img{width:100%;height:100%;object-fit:contain;pointer-events:none}.actor .placeholder{background:#dfb7e7;color:#342343;border-radius:12px;padding:12px;text-align:center}.actor .name{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#12251dcc;border-radius:5px;padding:2px 6px;font-size:12px}.panel{background:#19312b;border-radius:12px;padding:14px;max-height:calc(100vh - 95px);overflow:auto}.panel h2{font-size:16px;margin:8px 0}label.field{display:block;margin:10px 0;font-size:12px;color:#c8d8d0}.field input,.field textarea{margin-top:4px;font-size:14px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tools{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tools button{font-size:12px;padding:7px}.item{display:block;width:100%;text-align:left;margin:5px 0;background:#264b3e}.item.active{outline:2px solid #ffd27c}.hint{color:#b6cfc2;font-size:12px;line-height:1.5}hr{border:0;border-top:1px solid #406054;margin:15px 0}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{max-height:none}.canvas-wrap{min-height:0;padding:5px}header{gap:6px}button,.upload{font-size:12px;padding:7px}}
</style></head><body><header><h1>🌿 StoryScene Studio</h1><label class="upload">Hintergrund <input id="bgFile" type="file" accept="image/*"></label><label class="upload">Figur-Bild <input id="actorFile" type="file" accept="image/*" multiple></label><button id="add">+ Platzhalter</button><button id="save">Projekt speichern</button><button id="png">PNG exportieren</button><button id="json">JSON exportieren</button><label class="upload">JSON importieren<input id="import" type="file" accept=".json,application/json"></label></header>
<main class="layout"><div class="canvas-wrap"><div class="scene" id="scene"></div></div><aside class="panel"><h2>Figuren & Ebenen</h2><div id="layers"></div><hr><h2>Eigenschaften</h2><div id="props"><p class="hint">Figur auswählen oder hinzufügen.</p></div><hr><label class="field">Szenentitel<input id="title" value="Bildkarte 09"></label><label class="field">Szenenbeschreibung<textarea id="description" rows="3" placeholder="Was geschieht in der Szene?"></textarea></label><p class="hint">Alle Positionen und Größen werden relativ zur Hintergrundfläche gespeichert. Der JSON-Export enthält auch Bilddaten und Posenbeschreibungen. Bilder bleiben in deinem Browser, bis du sie exportierst.</p></aside></main>
<script>
const $=id=>document.getElementById(id),scene=$('scene');let bg='',actors=[],selected=null,drag=null;
const uid=()=>Math.random().toString(36).slice(2,10);
function fileData(f){return new Promise((resolve,reject)=>{const r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}
function download(name,blob){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function actor(name,img=''){return {id:uid(),name,img,x:50,y:50,w:15,h:32,rotation:0,flip:false,pose:'',appearance:'',gaze:'',label:true}}
function setSelected(id){selected=id;render()}
function render(){scene.replaceChildren();if(bg){const i=document.createElement('img');i.className='bg';i.src=bg;scene.append(i)}
actors.forEach(a=>{const el=document.createElement('div');el.className='actor'+(selected===a.id?' selected':'');el.style.cssText='left:'+a.x+'%;top:'+a.y+'%;width:'+a.w+'%;height:'+a.h+'%;transform:translate(-50%,-50%) rotate('+a.rotation+'deg) scaleX('+(a.flip?-1:1)+');z-index:'+actors.indexOf(a);if(a.img){const im=document.createElement('img');im.src=a.img;el.append(im)}else{const p=document.createElement('div');p.className='placeholder';p.textContent=a.name;el.append(p)}if(a.label){const n=document.createElement('div');n.className='name';n.textContent=a.name;n.style.transform='translateX(-50%) scaleX('+(a.flip?-1:1)+')';el.append(n)}el.onpointerdown=e=>{e.preventDefault();selected=a.id;drag={id:a.id,pointer:e.pointerId,startX:e.clientX,startY:e.clientY,x:a.x,y:a.y};el.setPointerCapture(e.pointerId);renderProperties();renderLayers()};el.onpointermove=e=>{if(!drag||drag.id!==a.id||drag.pointer!==e.pointerId)return;const r=scene.getBoundingClientRect();a.x=Math.max(0,Math.min(100,drag.x+(e.clientX-drag.startX)/r.width*100));a.y=Math.max(0,Math.min(100,drag.y+(e.clientY-drag.startY)/r.height*100));el.style.left=a.x+'%';el.style.top=a.y+'%';syncXY(a)};el.onpointerup=()=>{drag=null;render()};el.onpointercancel=()=>{drag=null;render()};scene.append(el)});renderLayers();renderProperties()}
function renderLayers(){const l=$('layers');l.replaceChildren();[...actors].reverse().forEach(a=>{const b=document.createElement('button');b.className='item'+(selected===a.id?' active':'');b.textContent=a.name;b.onclick=()=>setSelected(a.id);l.append(b)})}
function syncXY(a){['x','y'].forEach(k=>{const e=$('f_'+k);if(e)e.value=+a[k].toFixed(2)})}
function renderProperties(){const p=$('props'),a=actors.find(a=>a.id===selected);p.replaceChildren();if(!a){p.textContent='Figur auswählen.';return}
function field(key,label,type='text'){const wrap=document.createElement('label');wrap.className='field';wrap.textContent=label;const el=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')el.type=type;el.id='f_'+key;el.value=a[key]??'';if(type==='number')el.step='any';el.oninput=()=>{a[key]=type==='number'?Number(el.value):el.value;if(key==='name')renderLayers();renderSceneOnly()};wrap.append(el);p.append(wrap)}
field('name','Name');const grid=document.createElement('div');grid.className='pair';p.append(grid);for(const [k,l] of [['x','X %'],['y','Y %'],['w','Breite %'],['h','Höhe %'],['rotation','Drehung °']])field(k,l,'number');
field('pose','Pose / Handlung','textarea');field('appearance','Verbindliches Aussehen','textarea');field('gaze','Blick- und Zeigerichtung');
const buttons=document.createElement('div');buttons.className='tools';p.append(buttons);for(const [label,fn] of [['↔ Spiegeln',()=>a.flip=!a.flip],['↑ Vorne',()=>{const i=actors.indexOf(a);if(i<actors.length-1)[actors[i],actors[i+1]]=[actors[i+1],actors[i]]}],['↓ Hinten',()=>{const i=actors.indexOf(a);if(i>0)[actors[i],actors[i-1]]=[actors[i-1],actors[i]]}],['Duplizieren',()=>{const b={...a,id:uid(),x:a.x+4,y:a.y+4};actors.push(b);selected=b.id}],['Löschen',()=>{actors=actors.filter(x=>x!==a);selected=null}]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{fn();render()};buttons.append(b)}}
function renderSceneOnly(){const x=$('props');const active=document.activeElement;renderCanvas();if(active&&x.contains(active)){}}
function renderCanvas(){const old=$('props');const focus=document.activeElement;const id=focus?.id;const pos=focus?.selectionStart;const temp=focus&&old.contains(focus);render();if(temp&&id){const el=$(id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch{}}}}
$('bgFile').onchange=async e=>{if(e.target.files[0]){bg=await fileData(e.target.files[0]);render()}};
$('actorFile').onchange=async e=>{for(const f of e.target.files){const a=actor(f.name.replace(/\.[^.]+$/,''),await fileData(f));actors.push(a);selected=a.id}render();e.target.value=''};
$('add').onclick=()=>{const a=actor('Neue Figur');actors.push(a);selected=a.id;render()};
function project(){return {schema:'storyscene-studio/1',title:$('title').value,description:$('description').value,canvas:{width:1491,height:1055},background:bg,characters:actors}}
function exportJSON(){download('storyscene-projekt.json',new Blob([JSON.stringify(project(),null,2)],{type:'application/json'}))}
$('json').onclick=exportJSON;$('save').onclick=()=>{try{localStorage.setItem('storyscene-project',JSON.stringify(project()));alert('Projekt im Browser gespeichert')}catch(e){alert('Browser-Speicher voll. Bitte JSON exportieren.')}};
$('import').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!Array.isArray(j.characters))throw Error('Ungültige Szenendatei');actors=j.characters;bg=j.background||'';$('title').value=j.title||'';$('description').value=j.description||'';selected=null;render()}catch(err){alert('Import fehlgeschlagen: '+err.message)}};
$('png').onclick=async()=>{const w=1491,h=1055,c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');async function load(src){return new Promise((res,rej)=>{const i=new Image;i.onload=()=>res(i);i.onerror=rej;i.src=src})}try{ctx.fillStyle='#d1ddcf';ctx.fillRect(0,0,w,h);if(bg)ctx.drawImage(await load(bg),0,0,w,h);for(const a of actors){ctx.save();ctx.translate(a.x/100*w,a.y/100*h);ctx.rotate(a.rotation*Math.PI/180);ctx.scale(a.flip?-1:1,1);const aw=a.w/100*w,ah=a.h/100*h;if(a.img){const i=await load(a.img);ctx.drawImage(i,-aw/2,-ah/2,aw,ah)}else{ctx.fillStyle='#c68ed3';ctx.fillRect(-aw/2,-ah/2,aw,ah)}ctx.restore()}c.toBlob(b=>b&&download('storyscene-vorschau.png',b),'image/png')}catch(e){alert('PNG-Export fehlgeschlagen: '+e.message)}};
try{const j=JSON.parse(localStorage.getItem('storyscene-project')||'null');if(j){bg=j.background||'';actors=j.characters||[];$('title').value=j.title||'';$('description').value=j.description||''}}catch{}render();
</script></body></html>
